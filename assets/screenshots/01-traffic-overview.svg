<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161a23"/>
      <stop offset="100%" stop-color="#0d0f14"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Window Frame -->
  <rect width="900" height="440" rx="12" fill="url(#bgGrad)" stroke="#262f40" stroke-width="1.5"/>

  <!-- Window Controls -->
  <circle cx="28" cy="22" r="5" fill="#f43f5e"/>
  <circle cx="44" cy="22" r="5" fill="#f59e0b"/>
  <circle cx="60" cy="22" r="5" fill="#00e599"/>
  <text x="80" y="26" fill="#94a3b8" font-size="12" font-family="-apple-system, sans-serif" font-weight="600">HarLens — Network Traffic Inspector</text>

  <!-- Metrics Bar -->
  <rect x="24" y="48" width="852" height="44" rx="8" fill="#161c28" stroke="#262f40"/>
  <text x="44" y="74" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">Total: <tspan fill="#f1f5f9" font-weight="700">17</tspan></text>
  <text x="140" y="74" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">Visible: <tspan fill="#f1f5f9" font-weight="700">17</tspan></text>
  <text x="240" y="74" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">Errors: <tspan fill="#f43f5e" font-weight="700">3</tspan></text>
  <text x="340" y="74" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">Transferred: <tspan fill="#f1f5f9" font-weight="700">142.4 KB</tspan></text>
  <text x="480" y="74" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">Duration: <tspan fill="#f1f5f9" font-weight="700">1.14s</tspan></text>

  <rect x="740" y="58" width="120" height="24" rx="5" fill="#2563eb"/>
  <text x="760" y="74" fill="#ffffff" font-size="10.5" font-family="-apple-system, sans-serif" font-weight="600">Path Tables (4)</text>

  <!-- View Mode Bar -->
  <rect x="24" y="104" width="852" height="36" rx="6" fill="#161c28" stroke="#262f40"/>
  <rect x="28" y="108" width="76" height="28" rx="4" fill="#2563eb"/>
  <text x="40" y="126" fill="#ffffff" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">Flat List</text>
  <text x="124" y="126" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">By Domain</text>
  <text x="216" y="126" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">By Base Path</text>
  <text x="320" y="126" fill="#94a3b8" font-size="11" font-family="-apple-system, sans-serif">Tree Diagram</text>

  <!-- Traffic List Rows -->
  <!-- Row 1: GET 200 HTML -->
  <g transform="translate(24, 150)">
    <rect width="852" height="48" rx="6" fill="#161b26" stroke="#222b3a"/>
    <rect x="12" y="12" width="24" height="24" rx="4" fill="#3b82f6" fill-opacity="0.15"/>
    <text x="17" y="28" fill="#38bdf8" font-size="9" font-weight="700" font-family="monospace">HTML</text>
    <rect x="46" y="15" width="34" height="18" rx="3" fill="#2563eb" fill-opacity="0.2"/>
    <text x="52" y="28" fill="#60a5fa" font-size="10" font-weight="700" font-family="-apple-system, sans-serif">GET</text>
    <rect x="86" y="15" width="32" height="18" rx="3" fill="#00e599" fill-opacity="0.2"/>
    <text x="93" y="28" fill="#00e599" font-size="10" font-weight="700" font-family="-apple-system, sans-serif">200</text>
    <text x="128" y="25" fill="#f1f5f9" font-size="12" font-family="-apple-system, sans-serif" font-weight="600">/dashboard</text>
    <text x="128" y="38" fill="#64748b" font-size="10" font-family="-apple-system, sans-serif">app.cloudscale.io</text>
    <text x="760" y="28" fill="#94a3b8" font-size="11" font-family="monospace">18.4 KB  82ms</text>
  </g>

  <!-- Row 2: GET 200 JSON Customers -->
  <g transform="translate(24, 206)">
    <rect width="852" height="48" rx="6" fill="#161b26" stroke="#222b3a"/>
    <rect x="12" y="12" width="24" height="24" rx="4" fill="#a855f7" fill-opacity="0.15"/>
    <text x="19" y="28" fill="#a855f7" font-size="10" font-weight="700" font-family="monospace">{ }</text>
    <rect x="46" y="15" width="34" height="18" rx="3" fill="#2563eb" fill-opacity="0.2"/>
    <text x="52" y="28" fill="#60a5fa" font-size="10" font-weight="700" font-family="-apple-system, sans-serif">GET</text>
    <rect x="86" y="15" width="32" height="18" rx="3" fill="#00e599" fill-opacity="0.2"/>
    <text x="93" y="28" fill="#00e599" font-size="10" font-weight="700" font-family="-apple-system, sans-serif">200</text>
    <text x="128" y="25" fill="#f1f5f9" font-size="12" font-family="-apple-system, sans-serif" font-weight="600">/v1/customers?page=1&amp;limit=5</text>
    <text x="128" y="38" fill="#64748b" font-size="10" font-family="-apple-system, sans-serif">api.cloudscale.io</text>
    <text x="760" y="28" fill="#94a3b8" font-size="11" font-family="monospace">4.2 KB  52ms</text>
  </g>

  <!-- Row 3: POST 201 Checkout -->
  <g transform="translate(24, 262)">
    <rect width="852" height="48" rx="6" fill="#161b26" stroke="#222b3a"/>
    <rect x="12" y="12" width="24" height="24" rx="4" fill="#a855f7" fill-opacity="0.15"/>
    <text x="19" y="28" fill="#a855f7" font-size="10" font-weight="700" font-family="monospace">{ }</text>
    <rect x="46" y="15" width="38" height="18" rx="3" fill="#00e599" fill-opacity="0.2"/>
    <text x="50" y="28" fill="#00e599" font-size="10" font-weight="700" font-family="-apple-system, sans-serif">POST</text>
    <rect x="90" y="15" width="32" height="18" rx="3" fill="#00e599" fill-opacity="0.2"/>
    <text x="97" y="28" fill="#00e599" font-size="10" font-weight="700" font-family="-apple-system, sans-serif">201</text>
    <text x="132" y="25" fill="#f1f5f9" font-size="12" font-family="-apple-system, sans-serif" font-weight="600">/v1/checkout/subscriptions</text>
    <text x="132" y="38" fill="#64748b" font-size="10" font-family="-apple-system, sans-serif">api.cloudscale.io</text>
    <text x="760" y="28" fill="#94a3b8" font-size="11" font-family="monospace">1.8 KB  115ms</text>
  </g>

  <!-- Row 4: GET 400 Bad Request -->
  <g transform="translate(24, 318)">
    <rect width="852" height="48" rx="6" fill="#161b26" stroke="#222b3a"/>
    <rect x="12" y="12" width="24" height="24" rx="4" fill="#a855f7" fill-opacity="0.15"/>
    <text x="19" y="28" fill="#a855f7" font-size="10" font-weight="700" font-family="monospace">{ }</text>
    <rect x="46" y="15" width="34" height="18" rx="3" fill="#2563eb" fill-opacity="0.2"/>
    <text x="52" y="28" fill="#60a5fa" font-size="10" font-weight="700" font-family="-apple-system, sans-serif">GET</text>
    <rect x="86" y="15" width="32" height="18" rx="3" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="93" y="28" fill="#f59e0b" font-size="10" font-weight="700" font-family="-apple-system, sans-serif">400</text>
    <text x="128" y="25" fill="#f1f5f9" font-size="12" font-family="-apple-system, sans-serif" font-weight="600">/v1/analytics/query?range=invalid</text>
    <text x="128" y="38" fill="#64748b" font-size="10" font-family="-apple-system, sans-serif">api.cloudscale.io</text>
    <text x="760" y="28" fill="#94a3b8" font-size="11" font-family="monospace">520 B  28ms</text>
  </g>

  <!-- Row 5: POST 500 Server Error -->
  <g transform="translate(24, 374)">
    <rect width="852" height="48" rx="6" fill="#161b26" stroke="#222b3a"/>
    <rect x="12" y="12" width="24" height="24" rx="4" fill="#f43f5e" fill-opacity="0.15"/>
    <text x="19" y="28" fill="#f43f5e" font-size="10" font-weight="700" font-family="monospace">{ }</text>
    <rect x="46" y="15" width="38" height="18" rx="3" fill="#00e599" fill-opacity="0.2"/>
    <text x="50" y="28" fill="#00e599" font-size="10" font-weight="700" font-family="-apple-system, sans-serif">POST</text>
    <rect x="90" y="15" width="32" height="18" rx="3" fill="#f43f5e" fill-opacity="0.2"/>
    <text x="97" y="28" fill="#f43f5e" font-size="10" font-weight="700" font-family="-apple-system, sans-serif">500</text>
    <text x="132" y="25" fill="#f1f5f9" font-size="12" font-family="-apple-system, sans-serif" font-weight="600">/v1/payment-gateway/webhooks</text>
    <text x="132" y="38" fill="#64748b" font-size="10" font-family="-apple-system, sans-serif">api.cloudscale.io</text>
    <text x="760" y="28" fill="#94a3b8" font-size="11" font-family="monospace">740 B  145ms</text>
  </g>
</svg>
